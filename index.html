<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Real-time weather conditions and forecasts" />
    <!-- Open connections to the weather API while the app's JavaScript loads
         (DNS + TCP + TLS costs ~0.6–0.8s per host on a cold start). -->
    <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
    <link rel="preconnect" href="https://geocoding-api.open-meteo.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load the font stylesheet without blocking first paint; text renders in
         the system font until Inter arrives (display=swap). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      onload="this.onload = null; this.rel = 'stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
    <title>Skycast — Weather</title>
    <script>
      // Mirrors src/hooks/useTheme.js: saved choice, else the OS setting.
      (function () {
        var theme;
        try { theme = JSON.parse(localStorage.getItem('skycast:theme')); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Skycast needs JavaScript enabled to show the weather.</noscript>
    <script>
      // If the app never starts (e.g. index.html opened directly from disk or
      // through a plain static server instead of Vite), explain instead of
      // leaving a blank page.
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML =
            '<div style="max-width:520px;margin:15vh auto;padding:24px;font-family:system-ui,sans-serif;color:#fff;background:rgba(255,255,255,.12);border-radius:20px;text-align:center">' +
            '<h1 style="font-size:1.3rem;margin-bottom:8px">Skycast didn\'t start</h1>' +
            '<p style="opacity:.85;line-height:1.5">Run <code>npm run dev</code> in the project folder and open ' +
            '<a style="color:#fff" href="http://localhost:5173/">http://localhost:5173/</a>. ' +
            'Opening <code>index.html</code> directly (or with Live Server) doesn\'t work for a Vite app.</p></div>';
        }
      }, 4000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
